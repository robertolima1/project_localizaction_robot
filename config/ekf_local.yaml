# EKF local (robot_localization) — fusão de odometria de rodas (encoders) + IMU.
# Saída: /odometry/filtered. Documentação de qual nó publica cada TF: ver README,
# seção "Árvore TF" — aqui só o ekf_localization_node publica odom -> base_footprint
# (o plugin libgazebo_ros_diff_drive tem publishOdomTF=false, ver agrobot.gazebo.xacro).

frequency: 30                    # Hz — ver seção 1 do prompt
sensor_timeout: 0.2
two_d_mode: true                 # robô terrestre, plano único (sem z, roll, pitch)
publish_tf: true

odom_frame: odom
base_link_frame: base_footprint  # ATENÇÃO: no TurtleBot3 é base_footprint, não base_link
                                  # (ver 4.2(c) — misturar os dois é a causa nº1 de erro
                                  # silencioso de alguns centímetros de offset)
world_frame: odom                # não há EKF global, então world_frame == odom_frame
map_frame: map                   # declarado por exigência do robot_localization, mas
                                  # não usado (não existe segundo EKF nem AMCL)

# --- Rodas (/odom) ---
# Fundir apenas VELOCIDADES (vx, vyaw), nunca x/y/yaw absolutos daqui: a pose
# absoluta do /odom já é dead reckoning puro, então fundi-la brigaria com o
# yaw absoluto que vem da IMU (duas fontes competindo pelo mesmo estado).
odom0: /odom
odom0_config: [false, false, false,   # x,     y,     z      -> não fundir (dead reckoning puro)
               false, false, false,   # roll,  pitch, yaw    -> não fundir (yaw vem da IMU)
               true,  false, false,   # vx,    vy,    vz     -> fundir vx (diferencial não tem vy real)
               false, false, true,    # vroll, vpitch, vyaw  -> fundir vyaw (giro em torno de z)
               false, false, false]   # ax,    ay,    az     -> odometria não mede aceleração
odom0_differential: false
odom0_queue_size: 10

# --- IMU (/imu) ---
# Yaw absoluto (corrige a deriva de orientação do encoder) + vyaw (giroscópio,
# mais responsivo que o yaw absoluto sozinho) + aceleração longitudinal (ax).
imu0: /imu
imu0_config: [false, false, false,   # x,     y,     z      -> IMU não mede posição
              false, false, true,    # roll,  pitch, yaw    -> fundir yaw (única referência absoluta)
              false, false, false,   # vx,    vy,    vz     -> velocidade linear vem do encoder, não da IMU
              false, false, true,    # vroll, vpitch, vyaw  -> fundir vyaw (giroscópio)
              true,  false, false]   # ax,    ay,    az     -> fundir ax (aceleração longitudinal)
imu0_differential: false
imu0_relative: false               # yaw relativo ao heading inicial, não a um norte absoluto
imu0_remove_gravitational_acceleration: false
imu0_queue_size: 10

# Sem process_noise_covariance/initial_estimate_covariance aqui: EKF mais
# simples possível, sem nenhum ajuste manual de ruído — usa os defaults
# internos do robot_localization (o pacote já cai no mesmo exemplo de
# matriz que estava hardcoded aqui, exceto os índices 5/11 (yaw/vyaw) que
# tinham sido deixados mais permissivos manualmente).
